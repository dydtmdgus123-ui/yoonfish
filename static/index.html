<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#071422" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="포항 실시간 낚시 포인트 추천" />
  <title>윤피쉬 · 포항 포인트</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon.svg" sizes="any" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            sea: { 950: "#071422", 900: "#0a1c30", 800: "#0e2a46", 500: "#0e7490", 300: "#22d3ee" },
          },
          fontFamily: { sans: ["Pretendard", "system-ui", "sans-serif"] },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <style>
    :root { --sheet-h: 20vh; --sheet-max: 88vh; --sheet-shift: 68vh; }
    html, body { height: 100%; margin: 0; background: #071422; overscroll-behavior: none; }
    body { font-family: "Pretendard Variable", Pretendard, system-ui, sans-serif; }
    #map { position: fixed; inset: 0; }
    #map-fallback { position: fixed; inset: 0; display: none; }
    .glass {
      background: rgba(7, 20, 34, 0.78);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .pin {
      width: 22px; height: 22px; border-radius: 999px; border: 3px solid #fff;
      box-shadow: 0 4px 12px rgba(0,0,0,.45); transform: translate(-50%, -50%);
      box-sizing: border-box;
    }
    .pin-safe { background: #10B981 !important; }
    .pin-caution { background: #F59E0B !important; }
    .pin-danger { background: #EF4444 !important; animation: danger-pulse 1.45s ease-out infinite; }
    .pin-wrap { position: relative; width: 22px; height: 22px; overflow: visible; }
    .pin-label {
      position: absolute; left: 16px; top: -10px; white-space: nowrap;
      font-size: 11px; font-weight: 800; letter-spacing: -0.02em;
      padding: 2px 7px; border-radius: 999px; pointer-events: none;
      border: 1px solid rgba(255,255,255,.55);
      box-shadow: 0 2px 8px rgba(0,0,0,.35);
    }
    .pin-label-safe { background: #10B981; color: #fff; }
    .pin-label-caution { background: #F59E0B; color: #1c1917; }
    .pin-label-danger { background: #EF4444; color: #fff; }
    .pin-label-mine { background: #F59E0B; color: #1c1917; }
    .pin-label-gps { background: #38bdf8; color: #082f49; }
    .pin-label-search { background: #7c3aed; color: #fff; }
    .pin-search {
      width: 18px; height: 18px; border-radius: 999px; transform: translate(-50%, -50%);
      background: #a78bfa; border: 3px solid #fff;
      box-shadow: 0 0 0 0 rgba(167,139,250,.65);
      animation: gps-pulse 1.6s ease-out infinite;
    }
    .pin-on { width: 26px; height: 26px; outline: 3px solid rgba(255,255,255,.85); }
    .pin-mine {
      width: 22px; height: 22px; border-radius: 7px; transform: translate(-50%, -50%);
      background: linear-gradient(145deg, #fde68a, #f59e0b);
      border: 2px solid #fff; box-shadow: 0 4px 14px rgba(245,158,11,.45);
      display: grid; place-items: center; font-size: 12px; line-height: 1;
    }
    .pin-mine.pin-on { outline: 3px solid rgba(250, 204, 21, .75); }
    .pulse-pin {
      width: 16px; height: 16px; border-radius: 999px; transform: translate(-50%, -50%);
      background: #38bdf8; border: 2px solid #fff;
      box-shadow: 0 0 0 0 rgba(56,189,248,.65);
      animation: gps-pulse 1.6s ease-out infinite;
    }
    @keyframes gps-pulse {
      0% { box-shadow: 0 0 0 0 rgba(56,189,248,.55); }
      70% { box-shadow: 0 0 0 16px rgba(56,189,248,0); }
      100% { box-shadow: 0 0 0 0 rgba(56,189,248,0); }
    }
    @keyframes danger-pulse {
      0% { box-shadow: 0 0 0 0 rgba(239,68,68,.72); }
      70% { box-shadow: 0 0 0 16px rgba(239,68,68,0); }
      100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); }
    }
    .legend-bar {
      margin: 12px 12px 0;
      display: flex; align-items: stretch; gap: 2px;
      padding: 4px;
      min-height: 46px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,.16);
      box-shadow: 0 10px 28px rgba(0,0,0,.35);
    }
    .legend-btn {
      flex: 1;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      min-height: 38px; min-width: 38px;
      padding: 0 8px; border: 0; border-radius: 999px;
      background: transparent; color: #f8fafc;
      font-size: 12.5px; font-weight: 800; letter-spacing: -0.02em;
      white-space: nowrap; -webkit-tap-highlight-color: transparent;
    }
    .legend-btn.is-on { color: #fff; }
    .legend-btn:not(.is-on) { opacity: .38; }
    .legend-btn.is-on[data-filter="safe"] { background: rgba(16,185,129,.22); }
    .legend-btn.is-on[data-filter="caution"] { background: rgba(245,158,11,.22); }
    .legend-btn.is-on[data-filter="danger"] { background: rgba(239,68,68,.22); }
    .legend-btn.is-on[data-filter="mine"] { background: rgba(250,204,21,.18); }
    .legend-dot {
      width: 12px; height: 12px; border-radius: 999px; flex-shrink: 0;
      border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.35);
    }
    .legend-star { font-size: 14px; line-height: 1; }
    .search-wrap { position: relative; margin: 10px 12px 0; z-index: 24; }
    .search-box {
      display: flex; align-items: center; gap: 8px;
      min-height: 44px; padding: 0 12px; border-radius: 16px;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,.16);
      box-shadow: 0 8px 22px rgba(0,0,0,.28);
    }
    .search-box input {
      flex: 1; min-width: 0; background: transparent; border: 0;
      color: #f8fafc; font-size: 14px; font-weight: 600; outline: none;
    }
    .search-box input::placeholder { color: #94a3b8; font-weight: 500; }
    #search-results {
      display: none; position: absolute; left: 0; right: 0; top: calc(100% + 6px);
      max-height: 42vh; overflow-y: auto; border-radius: 16px;
      background: rgba(15, 23, 42, 0.96);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,.14);
      box-shadow: 0 12px 32px rgba(0,0,0,.4); z-index: 40;
    }
    #search-results.open { display: block; }
    .search-hit {
      width: 100%; text-align: left; padding: 10px 12px;
      border: 0; border-bottom: 1px solid rgba(255,255,255,.06);
      background: transparent; color: #e2e8f0;
    }
    .search-hit:last-child { border-bottom: 0; }
    .search-hit:active, .search-hit:hover { background: rgba(255,255,255,.06); }
    #search-card {
      display: none; position: fixed; left: 12px; right: 76px; z-index: 26;
      bottom: calc(var(--sheet-h) + 16px);
    }
    #search-card.open { display: block; }
    .sp-tag {
      border-radius: 999px; padding: 6px 10px; font-size: 12px; font-weight: 800;
      background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
      color: #e2e8f0;
    }
    .sp-tag.is-on { background: rgba(34,211,238,.22); border-color: rgba(34,211,238,.5); color: #a5f3fc; }
    #sheet {
      position: fixed; left: 0; right: 0; bottom: 0;
      height: var(--sheet-max);
      transform: translate3d(0, var(--sheet-shift), 0);
      will-change: transform;
      border-radius: 22px 22px 0 0; z-index: 30;
      box-shadow: 0 -12px 40px rgba(0,0,0,.4);
      transition: transform .28s cubic-bezier(.2,.8,.2,1);
      padding-bottom: env(safe-area-inset-bottom);
      color: #e2e8f0;
      overflow: hidden;
      backface-visibility: hidden;
    }
    #sheet.dragging { transition: none; }
    .sheet-handle {
      padding: 12px 0 8px; cursor: grab; touch-action: none;
      min-height: 28px;
    }
    .sheet-handle-bar {
      width: 44px; height: 5px; border-radius: 999px;
      background: rgba(255,255,255,.48); margin: 0 auto;
    }
    #peek-summary { padding: 0 16px 8px; }
    #fabs {
      position: fixed; right: 12px; z-index: 25;
      display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
      bottom: calc(var(--sheet-h) + 16px);
      transition: bottom .28s cubic-bezier(.2,.8,.2,1);
      will-change: bottom;
    }
    #sheet.dragging ~ #fabs { transition: none; }
    .fab {
      width: 56px; height: 56px; border-radius: 999px;
      background: rgba(7, 20, 34, 0.88);
      backdrop-filter: blur(12px);
      border: 2px solid rgba(255,255,255,.2);
      color: #e0f2fe; box-shadow: 0 8px 24px rgba(0,0,0,.4);
      display: grid; place-items: center;
      font-size: 22px; font-weight: 800;
    }
    .fab-gps { background: #0e7490; color: #fff; }
    .fab-add { background: #f59e0b; color: #1c1917; }
    .fab:active { transform: scale(.95); }
    .chip { scroll-snap-align: start; }
    .chips { scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; }
    .badge-safe { background: rgba(16,185,129,.18); color: #6ee7b7; border: 1px solid rgba(16,185,129,.35); }
    .badge-caution { background: rgba(245,158,11,.18); color: #fcd34d; border: 1px solid rgba(245,158,11,.35); }
    .badge-danger { background: rgba(239,68,68,.18); color: #fca5a5; border: 1px solid rgba(239,68,68,.35); }
    .tag { background: rgba(14,116,144,.25); color: #a5f3fc; border: 1px solid rgba(34,211,238,.25); }
    .mul-조금 { background: rgba(245,158,11,.18); color: #fcd34d; border: 1px solid rgba(245,158,11,.4); }
    .mul-사리, .mul-무시 { background: rgba(244,63,94,.18); color: #fda4af; border: 1px solid rgba(244,63,94,.4); }
    .mul-중조 { background: rgba(34,211,238,.16); color: #a5f3fc; border: 1px solid rgba(34,211,238,.28); }
    .tide-hi { border-color: rgba(56,189,248,.45); background: rgba(14,165,233,.14); }
    .tide-lo { border-color: rgba(148,163,184,.35); background: rgba(148,163,184,.08); }
    .tide-now { outline: 2px solid rgba(250,204,21,.55); outline-offset: 1px; }
    .golden { border-color: rgba(250,204,21,.55); background: rgba(250,204,21,.12); color: #fde68a; }
    .logo-mark {
      width: 40px; height: 40px; flex-shrink: 0; display: block;
      border-radius: 10px; overflow: hidden;
      box-shadow: 0 4px 12px rgba(8, 51, 68, .35);
    }
    .hide-scroll { scrollbar-width: none; }
    .hide-scroll::-webkit-scrollbar { display: none; }
    .field {
      width: 100%; border-radius: 12px; background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.12); color: #e2e8f0;
      padding: 10px 12px; font-size: 14px;
    }
    .field:focus { outline: none; border-color: rgba(34,211,238,.55); }
    #save-modal { display: none; }
    #save-modal.open { display: block; }
    #toast {
      position: fixed; left: 50%; transform: translateX(-50%);
      bottom: calc(var(--sheet-h) + 72px); z-index: 60;
      display: none; max-width: calc(100% - 32px);
      padding: 8px 14px; border-radius: 999px;
      background: rgba(7,20,34,.9); border: 1px solid rgba(255,255,255,.12);
      font-size: 12px; color: #e2e8f0;
    }
  </style>
</head>
<body class="text-slate-100">
  <div id="map"></div>
  <div id="map-fallback" class="bg-sea-950 px-4 pt-24 pb-48 overflow-y-auto">
    <p id="fallback-msg" class="text-sm text-cyan-200/80 mb-3"></p>
    <div id="fallback-list" class="space-y-3"></div>
  </div>

  <header class="fixed top-0 left-0 right-0 z-20 pt-[env(safe-area-inset-top)]">
    <div class="mx-3 mt-3 glass rounded-2xl px-3 py-2.5 flex items-center gap-2 border border-white/10">
      <svg class="logo-mark" viewBox="0 0 64 64" aria-hidden="true">
        <defs>
          <linearGradient id="yfLogoBg" x1="8" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#22d3ee"/>
            <stop offset="45%" stop-color="#0e7490"/>
            <stop offset="100%" stop-color="#083344"/>
          </linearGradient>
        </defs>
        <rect width="64" height="64" rx="16" fill="url(#yfLogoBg)"/>
        <path d="M10 42c10-3 22-4 34-1" fill="none" stroke="rgba(255,255,255,.28)" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M12 48c12-2.2 24-1.4 36 2" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="2" stroke-linecap="round"/>
        <path d="M16 32c10-14 30-15 40-3-9 2-13 7-13 13-8-1-18 1-27-10z" fill="#fff"/>
        <circle cx="47" cy="26.5" r="2.2" fill="#083344"/>
        <path d="M16 32c-5 1-8.5 6-10 11 7-1 11-3.5 13-8z" fill="#ecfeff"/>
      </svg>
      <div class="flex-1 min-w-0">
        <div class="text-[15px] font-bold tracking-tight">윤피쉬</div>
        <div id="subhead" class="text-[11px] text-cyan-200/70 truncate">포항 포인트 · 불러오는 중</div>
      </div>
      <button id="btn-refresh" class="w-9 h-9 rounded-xl bg-white/10 grid place-items-center active:scale-95" aria-label="새로고침">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.2-5.8"/><path d="M21 3v7h-7"/></svg>
      </button>
    </div>
    <div id="legend" class="legend-bar">
      <button type="button" class="legend-btn is-on" data-filter="safe" aria-pressed="true">
        <span class="legend-dot" style="background:#10B981"></span>양호
      </button>
      <button type="button" class="legend-btn is-on" data-filter="caution" aria-pressed="true">
        <span class="legend-dot" style="background:#F59E0B"></span>주의
      </button>
      <button type="button" class="legend-btn is-on" data-filter="danger" aria-pressed="true">
        <span class="legend-dot" style="background:#EF4444"></span>위험
      </button>
      <button type="button" class="legend-btn is-on" data-filter="mine" aria-pressed="true">
        <span class="legend-star" aria-hidden="true">⭐</span>내포인트
      </button>
    </div>
    <div class="search-wrap">
      <form id="search-form" class="search-box" autocomplete="off">
        <span aria-hidden="true">🔍</span>
        <input id="place-search" type="search" enterkeyhint="search" placeholder="방파제·지명·도로명·지번 검색" />
        <button type="submit" class="text-[12px] font-extrabold text-cyan-200 shrink-0">검색</button>
      </form>
      <div id="search-results" class="hide-scroll"></div>
    </div>
  </header>

  <div id="search-card" class="glass rounded-2xl border border-white/10 p-3 shadow-lg">
    <div id="search-card-title" class="text-[14px] font-extrabold truncate"></div>
    <div id="search-card-sub" class="text-[11px] text-slate-400 mt-0.5 truncate"></div>
    <button type="button" id="btn-save-search" class="mt-2 w-full rounded-xl bg-amber-400 text-sea-950 text-[13px] font-extrabold py-2.5">📍 이 위치를 포인트로 저장</button>
  </div>

  <div id="fabs">
    <button id="btn-add" class="fab fab-add" aria-label="포인트 등록">➕</button>
    <button id="btn-gps" class="fab fab-gps" aria-label="내 위치">🎯</button>
  </div>
  <div id="toast"></div>

  <section id="sheet" class="glass border-t border-white/10">
    <div id="sheet-handle" class="sheet-handle" aria-label="바텀시트 핸들">
      <div class="sheet-handle-bar"></div>
    </div>
    <div id="peek-summary"></div>
    <div id="sheet-body" class="px-4 pb-4 overflow-y-auto hide-scroll" style="height: calc(100% - 96px);">
      <div class="flex gap-1 mb-2 p-1 rounded-xl bg-white/5 border border-white/10">
        <button id="tab-official" class="flex-1 rounded-lg py-1.5 text-[12px] font-bold bg-cyan-400 text-sea-950">추천 포인트</button>
        <button id="tab-mine" class="flex-1 rounded-lg py-1.5 text-[12px] font-bold text-slate-300">내 포인트 목록</button>
      </div>
      <div id="chips" class="chips flex gap-2 overflow-x-auto hide-scroll pb-3 -mx-1 px-1"></div>
      <div id="card"></div>
    </div>
  </section>

  <div id="save-modal" class="fixed inset-0 z-50">
    <div id="save-backdrop" class="absolute inset-0 bg-black/55"></div>
    <form id="save-form" class="absolute left-3 right-3 bottom-6 glass rounded-2xl border border-white/10 p-4 space-y-2.5">
      <div class="flex items-center justify-between">
        <h3 class="text-[16px] font-bold">📍 이 위치를 포인트로 저장</h3>
        <button type="button" id="save-close" class="w-8 h-8 rounded-lg bg-white/10 grid place-items-center text-slate-300">✕</button>
      </div>
      <p id="save-coords" class="text-[11px] text-cyan-200/70"></p>
      <label class="block text-[11px] text-slate-400">포인트 이름
        <input id="f-name" class="field mt-1" required maxlength="40" placeholder="예: 영일대 남측 테트라" />
      </label>
      <div>
        <div class="text-[11px] text-slate-400 mb-1.5">오늘 추천 어종 · 터치해서 선택</div>
        <div id="species-picks" class="flex flex-wrap gap-1.5 mb-1.5"></div>
        <label class="block text-[11px] text-slate-400">공략 어종
          <input id="f-species" class="field mt-1" maxlength="80" placeholder="태그를 누르거나 직접 입력" />
        </label>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <label class="block text-[11px] text-slate-400">수심
          <input id="f-depth" class="field mt-1" maxlength="20" placeholder="예: 3~4m" />
        </label>
        <label class="flex items-end gap-2 text-[13px] text-slate-200 pb-2">
          <input id="f-snag" type="checkbox" class="w-4 h-4 accent-amber-400" />
          밑걸림 주의
        </label>
      </div>
      <label class="block text-[11px] text-slate-400">메모
        <textarea id="f-memo" class="field mt-1 min-h-[72px]" maxlength="200" placeholder="입질 시간, 밑밥, 주차, 주의사항"></textarea>
      </label>
      <button type="submit" class="w-full rounded-xl bg-cyan-400 text-sea-950 font-bold py-3 active:scale-[.99]">이 기기에 저장</button>
      <p class="text-[10px] text-slate-500 text-center">로그인 없이 이 스마트폰(브라우저)에만 보관됩니다.</p>
    </form>
  </div>

  <script>
    const API_BASE = (window.location && window.location.origin) ? window.location.origin : "";
    function apiUrl(path) {
      const p = path.startsWith("/") ? path : "/" + path;
      return API_BASE + p;
    }
    async function apiGet(path, options = {}) {
      const res = await fetch(apiUrl(path), { cache: "no-store", ...options });
      if (!res.ok) throw new Error("api " + path + " " + res.status);
      return res.json();
    }

    let PEEK = Math.round(window.innerHeight * 0.20);
    let HALF = Math.round(window.innerHeight * 0.45);
    let FULL = Math.round(window.innerHeight * 0.88);
    const MINE_KEY = "yunfish.myPoints.v1";
    const ALERT_COLOR = { safe: "#10B981", caution: "#F59E0B", danger: "#EF4444" };
    const POHANG = { lat: 36.05, lng: 129.45 };
    const SEASON_TAGS = {
      3: ["감성돔", "학꽁치", "볼락", "숭어", "도다리"],
      4: ["감성돔", "학꽁치", "숭어", "농어"],
      5: ["감성돔", "학꽁치", "전갱이", "농어"],
      6: ["전갱이", "고등어", "농어", "학꽁치"],
      7: ["전갱이", "고등어", "농어", "벵에돔"],
      8: ["전갱이", "고등어", "무늬오징어", "농어"],
      9: ["감성돔", "무늬오징어", "삼치", "전갱이", "갈치(풀치)", "학꽁치", "도다리"],
      10: ["감성돔", "무늬오징어", "삼치", "볼락"],
      11: ["감성돔", "볼락", "삼치", "무늬오징어"],
      12: ["볼락", "우럭", "도다리", "가자미"],
      1: ["볼락", "우럭", "도다리", "가자미"],
      2: ["볼락", "도다리", "학꽁치", "우럭"],
    };
    const state = {
      data: null, selected: null, selectedKind: "official", tab: "official",
      map: null, overlays: {}, mineOverlays: {}, gpsOverlay: null, searchOverlay: null,
      myPos: null, saveTarget: null, places: null, geocoder: null, gpsWatchId: null,
      kakaoReady: false, sheet: PEEK, mine: [], pickedSpecies: new Set(),
      filters: { safe: true, caution: true, danger: true, mine: true },
      overlayOn: {}, searchSeq: 0,
    };

    const $ = (id) => document.getElementById(id);
    function refreshSheetStops() {
      PEEK = Math.max(148, Math.round(window.innerHeight * 0.20));
      HALF = Math.round(window.innerHeight * 0.45);
      FULL = Math.round(window.innerHeight * 0.88);
      const el = $("sheet");
      if (el) el.style.height = FULL + "px";
      document.documentElement.style.setProperty("--sheet-max", FULL + "px");
    }
    const setSheet = (h, animate = true) => {
      const vis = Math.max(PEEK, Math.min(FULL, h));
      state.sheet = vis;
      const el = $("sheet");
      const shift = Math.max(0, FULL - vis);
      if (!animate) el.classList.add("dragging");
      el.style.transform = "translate3d(0," + shift + "px,0)";
      document.documentElement.style.setProperty("--sheet-h", vis + "px");
      document.documentElement.style.setProperty("--sheet-shift", shift + "px");
      if (animate) el.classList.remove("dragging");
    };

    const fmtDate = (iso) => {
      const d = new Date(iso);
      return `${d.getMonth() + 1}.${String(d.getDate()).padStart(2, "0")} (${"일월화수목금토"[d.getDay()]})`;
    };

    const badgeClass = (level) => ({ safe: "badge-safe", caution: "badge-caution", danger: "badge-danger" }[level] || "badge-safe");
    const alertLevel = (p) => (p?.alert?.level && ALERT_COLOR[p.alert.level] ? p.alert.level : "safe");
    const isOfficialShown = (p) => !!state.filters[alertLevel(p)];

    function visibleOfficials() {
      return (state.data?.points || []).filter(isOfficialShown);
    }

    function showOverlay(ov, key, show) {
      if (!ov) return;
      if (state.overlayOn[key] === show) return;
      state.overlayOn[key] = show;
      ov.setMap(show && state.map ? state.map : null);
    }

    function applyMapFilters() {
      document.querySelectorAll(".legend-btn").forEach((btn) => {
        const on = !!state.filters[btn.dataset.filter];
        btn.classList.toggle("is-on", on);
        btn.setAttribute("aria-pressed", on ? "true" : "false");
      });
      if (!state.map) return;
      (state.data?.points || []).forEach((p) => {
        showOverlay(state.overlays[p.id], p.id, isOfficialShown(p));
      });
      Object.keys(state.mineOverlays).forEach((id) => {
        showOverlay(state.mineOverlays[id], id, !!state.filters.mine);
      });
    }

    function toggleFilter(key) {
      state.filters[key] = !state.filters[key];
      if (key !== "mine") {
        const any = state.filters.safe || state.filters.caution || state.filters.danger;
        if (!any) state.filters[key] = true;
      }
      applyMapFilters();
      let selectedChanged = false;
      if (state.tab === "official" && state.selectedKind === "official") {
        const cur = (state.data?.points || []).find((x) => x.id === state.selected);
        if (!cur || !isOfficialShown(cur)) {
          const next = visibleOfficials()[0];
          if (next && next.id !== state.selected) {
            state.selected = next.id;
            selectedChanged = true;
          }
        }
      }
      renderChips();
      if (selectedChanged) {
        renderCard();
        highlightMarkers();
      } else {
        renderPeek();
      }
    }

    function toast(msg) {
      const el = $("toast");
      el.textContent = msg;
      el.style.display = "block";
      clearTimeout(toast._t);
      toast._t = setTimeout(() => { el.style.display = "none"; }, 2600);
    }

    function loadMine() {
      try { return JSON.parse(localStorage.getItem(MINE_KEY) || "[]"); } catch { return []; }
    }
    function persistMine() {
      localStorage.setItem(MINE_KEY, JSON.stringify(state.mine));
    }

    function todayAt(hhmm) {
      const [h, m] = String(hhmm || "00:00").split(":").map(Number);
      const d = new Date();
      d.setHours(h || 0, m || 0, 0, 0);
      return d;
    }

    function computeTideState(events) {
      const now = new Date();
      if (!events || !events.length) {
        return { phase: "unknown", phase_label: "-", badge: "조석 정보 없음", countdown: "-", progress: 0, next_kind: null };
      }
      const timed = events.map((ev) => ({ ...ev, dt: todayAt(ev.time) })).sort((a, b) => a.dt - b.dt);
      let prev = null, nxt = null;
      timed.forEach((ev) => {
        if (ev.dt <= now) prev = ev;
        else if (!nxt) nxt = ev;
      });
      if (!prev) {
        nxt = timed[0];
        const fake = new Date(nxt.dt.getTime() - (6 * 60 + 13) * 60000);
        prev = { type: nxt.type === "고조" ? "저조" : "고조", dt: fake };
      }
      if (!nxt) {
        const first = timed[0];
        nxt = { type: prev.type === "고조" ? "저조" : "고조", dt: new Date(first.dt.getTime() + 24 * 3600000), time: first.time };
      }
      const flood = prev.type === "저조";
      const nextKind = nxt.type === "고조" ? "만조" : "간조";
      const mins = Math.max(0, Math.round((nxt.dt - now) / 60000));
      const hours = Math.floor(mins / 60);
      const minutes = mins % 60;
      const countdown = hours ? `${nextKind}까지 ${hours}시간 ${minutes}분 전` : `${nextKind}까지 ${minutes}분 전`;
      const span = (nxt.dt - prev.dt) || 1;
      return {
        phase: flood ? "flood" : "ebb",
        phase_label: flood ? "들물" : "날물",
        badge: flood ? "🌊 들물 진행 중" : "🌙 날물 진행 중",
        countdown,
        next_kind: nextKind,
        next_time: nxt.time || String(nxt.dt.getHours()).padStart(2, "0") + ":" + String(nxt.dt.getMinutes()).padStart(2, "0"),
        minutes_left: mins,
        progress: Math.max(0, Math.min(1, (now - prev.dt) / span)),
      };
    }

    function tideStateOf(p) {
      return p?.tide?.progress || p?.tide?.state || state.data?.tide_progress || computeTideState(p?.tide?.events || []);
    }

    function nearestOfficial(lat, lng) {
      const points = state.data?.points || [];
      if (!points.length) return null;
      let best = points[0], bestD = Infinity;
      points.forEach((p) => {
        const d = (p.lat - lat) ** 2 + (p.lng - lng) ** 2;
        if (d < bestD) { bestD = d; best = p; }
      });
      return best;
    }

    function setTab(tab) {
      state.tab = tab === "mine" ? "mine" : "official";
      $("tab-official").className = "flex-1 rounded-lg py-1.5 text-[12px] font-bold " + (state.tab === "official" ? "bg-cyan-400 text-sea-950" : "text-slate-300");
      $("tab-mine").className = "flex-1 rounded-lg py-1.5 text-[12px] font-bold " + (state.tab === "mine" ? "bg-amber-400 text-sea-950" : "text-slate-300");
      renderChips();
      renderCard();
    }

    function renderPeek() {
      const el = $("peek-summary");
      if (!el) return;
      if (state.tab === "mine") {
        const n = (state.mine || []).length;
        el.innerHTML = `<div class="flex items-center justify-between gap-2">
          <div class="text-[14px] font-extrabold tracking-tight">내 포인트 ${n}곳</div>
          <div class="text-[11px] text-slate-400">핸들을 내려 지도 보기</div>
        </div>`;
        return;
      }
      const points = visibleOfficials();
      const p = points.find((x) => x.id === state.selected) || points[0];
      if (!p) {
        el.innerHTML = `<div class="text-[12px] text-slate-400">선택한 상태의 포인트가 없습니다</div>`;
        return;
      }
      const w = p.weather || {};
      const st = tideStateOf(p);
      const level = alertLevel(p);
      el.innerHTML = `<div class="flex items-start justify-between gap-2">
        <div class="min-w-0">
          <div class="text-[14px] font-extrabold tracking-tight truncate">${p.short_name}</div>
          <div class="text-[11px] text-slate-300 truncate">${st.badge || ""} · ${st.countdown || ""}</div>
        </div>
        <div class="text-right shrink-0">
          <div class="text-[11px] font-extrabold" style="color:${ALERT_COLOR[level]}">${p.alert.label}</div>
          <div class="text-[11px] tabular-nums text-cyan-100">${w.temp ?? "-"}° · ${w.wind_speed ?? "-"}m/s · ${mulDisplay(p)}</div>
        </div>
      </div>`;
    }

    function renderChips() {
      const wrap = $("chips");
      if (state.tab === "mine") {
        wrap.innerHTML = (state.mine || []).map((p) => {
          const on = state.selectedKind === "mine" && state.selected === p.id;
          return `<button data-id="${p.id}" class="chip shrink-0 rounded-full px-3 py-1.5 text-[12px] font-semibold border ${on ? "bg-amber-400 text-sea-950 border-amber-300" : "bg-white/5 border-white/10 text-slate-200"}">⭐ ${p.name}</button>`;
        }).join("") || `<span class="text-[12px] text-slate-500 px-1">아직 저장한 포인트가 없습니다.</span>`;
        wrap.querySelectorAll("button").forEach((btn) => btn.addEventListener("click", () => selectMine(btn.dataset.id, true)));
        return;
      }
      wrap.innerHTML = visibleOfficials().map((p) => {
        const on = state.selectedKind === "official" && state.selected === p.id;
        const level = alertLevel(p);
        return `<button data-id="${p.id}" class="chip shrink-0 rounded-full px-3 py-1.5 text-[12px] font-semibold border ${on ? "bg-cyan-400 text-sea-950 border-cyan-300" : "bg-white/5 border-white/10 text-slate-200"}">
          <span class="inline-block w-2 h-2 rounded-full mr-1 border border-white/80" style="background:${ALERT_COLOR[level]}"></span>${p.short_name}
        </button>`;
      }).join("") || `<span class="text-[12px] text-slate-500 px-1">선택한 상태의 포인트가 없습니다.</span>`;
      wrap.querySelectorAll("button").forEach((btn) => btn.addEventListener("click", () => selectPoint(btn.dataset.id, true)));
    }

    function windowRow(w) {
      const g = w.golden ? "golden" : "border-white/10 bg-white/5";
      return `<div class="rounded-xl border ${g} px-3 py-2">
        <div class="flex items-center justify-between gap-2">
          <span class="text-[13px] font-semibold">${w.label}</span>
          <span class="text-[13px] tabular-nums text-cyan-200">${w.start} – ${w.end}</span>
        </div>
        <div class="text-[11px] text-slate-400 mt-0.5">${w.detail}${w.anchor ? " · 기준 " + w.anchor : ""}</div>
      </div>`;
    }

    function mulDisplay(p) {
      const m = p.mul || (p.tide && p.tide.mul) || (state.data && state.data.mul) || {};
      if (p.mul_label) return p.mul_label;
      if (m.display) return m.display;
      const label = m.label || (m.num != null ? m.num + "물" : "");
      if (m.phase && m.phase !== "중조" && label) return `${m.phase} (${label})`;
      if (label) return label;
      if (m.badge) return m.badge;
      return "10물";
    }

    function numOr(val, fallback) {
      const n = Number(val);
      return Number.isFinite(n) ? n : fallback;
    }

    function tideTimeline(p) {
      const events = p.tide?.events || [];
      const st = tideStateOf(p);
      const flood = st.phase === "flood";
      const rows = events.map((t) => {
        const kind = t.type === "고조" ? "만조" : "간조";
        const cm = t.height_cm != null ? t.height_cm + "cm" : (t.height != null ? t.height + "m" : "");
        const isNext = st.next_time === t.time;
        return `<div class="relative flex items-center gap-3 py-1.5">
          <div class="relative z-[1] w-3.5 h-3.5 rounded-full border-2 shrink-0 ${t.type === "고조" ? "bg-sky-400 border-sky-100" : "bg-slate-400 border-slate-200"} ${isNext ? "ring-2 ring-amber-300 ring-offset-1 ring-offset-transparent" : ""}"></div>
          <div class="flex-1 flex items-baseline justify-between gap-2">
            <span class="text-[13px] font-semibold ${t.type === "고조" ? "text-sky-200" : "text-slate-300"}">${kind}</span>
            <span class="text-[13px] tabular-nums font-bold">${t.time} <span class="text-[11px] font-medium text-cyan-200/80">${cm}</span></span>
          </div>
        </div>`;
      }).join("");
      const pct = Math.round((st.progress || 0) * 100);
      return `
        <div class="rounded-2xl border border-cyan-300/20 bg-gradient-to-b from-sky-500/10 to-white/[.03] p-3 mb-3">
          <div class="flex items-center justify-between gap-2 mb-2">
            <div class="text-[11px] font-semibold text-slate-400">오늘 간조 · 만조 · 포항</div>
            <span class="text-[11px] font-bold rounded-full px-2 py-0.5 border ${flood ? "bg-sky-500/20 text-sky-100 border-sky-300/40" : "bg-indigo-500/15 text-indigo-100 border-indigo-300/35"}">${st.badge || "조석"}</span>
          </div>
          <div class="text-[14px] font-bold text-cyan-50 mb-3">${st.countdown || ""}</div>
          <div class="relative pl-1 mb-3">
            <div class="absolute left-[6px] top-2 bottom-2 w-px bg-white/15"></div>
            ${rows || `<span class="text-[12px] text-slate-500">조석 데이터 없음</span>`}
          </div>
          <div class="h-1.5 rounded-full bg-white/10 overflow-hidden">
            <div class="h-full rounded-full ${flood ? "bg-sky-400" : "bg-indigo-300"}" style="width:${pct}%"></div>
          </div>
          <div class="text-[10px] text-slate-500 mt-1.5">${st.phase_label || ""} 진행 ${pct}% · 다음 ${st.next_kind || "-"} ${st.next_time || ""}</div>
        </div>`;
    }

    function renderCard() {
      renderPeek();
      if (state.tab === "mine") {
        renderMineCard();
        return;
      }
      const points = visibleOfficials();
      const p = points.find((x) => x.id === state.selected) || points[0];
      if (!p) {
        $("card").innerHTML = `<p class="text-sm text-slate-400">선택한 상태의 포인트가 없습니다. 상단 범례를 다시 켜 주세요.</p>`;
        return;
      }
      const w = p.weather || {};
      const mul = p.mul || p.tide?.mul || state.data?.mul || {};
      const mulPhase = mul.phase || "중조";
      const mulText = mulDisplay(p);
      const sst = numOr(w.water_temp ?? w.sst ?? w.waterTemp, 22.4);
      const pop = numOr(w.pop ?? w.POP, 10);
      $("card").innerHTML = `
        <div class="flex items-start justify-between gap-2 mb-2">
          <div>
            <div class="text-[11px] text-cyan-300/80">${p.area} · ${p.season} · 일출 ${p.sun.sunrise} / 일몰 ${p.sun.sunset}</div>
            <h2 class="text-[20px] font-bold leading-tight mt-0.5">${p.name}</h2>
          </div>
          <div class="flex flex-col items-end gap-1 shrink-0">
            <span class="text-[11px] font-bold px-2 py-1 rounded-full ${badgeClass(p.alert.level)}">${p.alert.label}</span>
            <span class="text-[11px] font-bold px-2 py-1 rounded-full mul-${mulPhase}">${mulText}</span>
          </div>
        </div>
        <p class="text-[12px] text-amber-100/80 mb-3">${p.alert.message}</p>
        <div class="grid grid-cols-3 gap-2 mb-3">
          ${metric("수온", sst.toFixed(1) + "℃", Number.isFinite(Number(w.water_temp)) ? "앞바다" : "9월 평균 추정")}
          ${metric("유의파고", (w.wave_height ?? "-") + (w.wave_height != null ? "m" : ""), w.source === "mock" ? "추정" : "실시간")}
          ${metric("풍속", (w.wind_speed ?? "-") + (w.wind_speed != null ? "m/s" : ""), w.wind_dir || "")}
          ${metric("기온", (w.temp ?? "-") + (w.temp != null ? "°" : ""), w.sky || "")}
          ${metric("강수확률", pop + "%", w.pty && w.pty !== "없음" ? w.pty : "예보")}
          ${metric("물때", mulText, mul.phase_note || mulPhase)}
        </div>
        ${tideTimeline(p)}
        <div class="text-[11px] font-semibold text-slate-400 mb-1.5">오늘 추천 어종</div>
        <div class="flex flex-wrap gap-1.5 mb-3">
          ${(p.today_species || []).map((s) => `<span class="tag text-[12px] font-semibold px-2.5 py-1 rounded-full">#${s}</span>`).join("")}
        </div>
        <div class="text-[11px] font-semibold text-slate-400 mb-1.5">황금 물때 시간대 (피딩 · 물돌이)</div>
        <div class="space-y-1.5 mb-3">${(p.windows || []).map(windowRow).join("")}</div>
        <p class="text-[12px] text-slate-400 leading-relaxed">${p.tip}</p>
        <p class="text-[10px] text-slate-500 mt-3">날씨 ${p.data_source.weather} · 조석 ${p.data_source.tide} · 부이 ${p.data_source.buoy || "-"} · 30분 캐시</p>
      `;
    }

    function weatherMini(w, alert) {
      if (!w) return "";
      return `
        <div class="grid grid-cols-3 gap-2 mb-3">
          ${metric("기온", (w.temp ?? "-") + (w.temp != null ? "°" : ""), w.sky || "")}
          ${metric("풍속", (w.wind_speed ?? "-") + (w.wind_speed != null ? "m/s" : ""), w.wind_dir || "")}
          ${metric("파고", (w.wave_height ?? "-") + (w.wave_height != null ? "m" : ""), alert?.label || "")}
        </div>`;
    }

    function renderMineCard() {
      const list = state.mine || [];
      if (!list.length) {
        $("card").innerHTML = `<div class="rounded-2xl border border-white/10 bg-white/5 p-4 text-center">
          <div class="text-[28px] mb-1">⭐</div>
          <p class="text-[14px] font-bold">저장된 내 포인트가 없습니다</p>
          <p class="text-[12px] text-slate-400 mt-1">검색 또는 GPS로 위치를 잡은 뒤<br/>우측 ➕ 버튼으로 바로 저장하세요.</p>
        </div>`;
        return;
      }
      const mine = list.find((x) => x.id === state.selected) || list[0];
      const near = nearestOfficial(mine.lat, mine.lng);
      const w = near?.weather || {};
      const st = near ? tideStateOf(near) : {};
      $("card").innerHTML = `
        <div class="flex items-start justify-between gap-2 mb-2">
          <div>
            <div class="text-[11px] text-amber-200/80">나만의 포인트 · ${mine.address ? escapeHtml(mine.address) + " · " : ""}${mine.lat.toFixed(5)}, ${mine.lng.toFixed(5)}</div>
            <h2 class="text-[20px] font-bold leading-tight mt-0.5">⭐ ${mine.name}</h2>
          </div>
          <button data-del="${mine.id}" class="text-[11px] font-bold px-2 py-1 rounded-full bg-rose-500/15 text-rose-200 border border-rose-400/30">삭제</button>
        </div>
        ${mine.species ? `<div class="text-[11px] font-semibold text-slate-400 mb-1">내가 고른 어종</div>
        <div class="flex flex-wrap gap-1.5 mb-2">${mine.species.split(/[,/，、]/).filter(Boolean).map((s) => `<span class="tag text-[12px] font-semibold px-2.5 py-1 rounded-full">#${escapeHtml(s.trim())}</span>`).join("")}</div>` : ""}
        ${near?.today_species?.length ? `<div class="text-[11px] font-semibold text-slate-400 mb-1">이 위치 오늘 추천 어종</div>
        <div class="flex flex-wrap gap-1.5 mb-3">${near.today_species.map((s) => `<span class="tag text-[12px] font-semibold px-2.5 py-1 rounded-full">#${s}</span>`).join("")}</div>` : ""}
        <div class="rounded-xl border border-amber-300/25 bg-amber-400/10 px-3 py-2 mb-3">
          <div class="text-[11px] text-amber-200/80 mb-0.5">내가 적은 메모</div>
          <p class="text-[13px] text-amber-50">${mine.memo ? escapeHtml(mine.memo) : "메모 없음"}</p>
          <div class="text-[11px] text-slate-400 mt-1.5">${mine.depth ? "수심 " + escapeHtml(mine.depth) : "수심 미입력"} · ${mine.snag ? "⚠️ 밑걸림 주의" : "밑걸림 없음"}</div>
        </div>
        <div class="text-[11px] font-semibold text-slate-400 mb-1.5">현재 이 위치 날씨 ${near ? "· " + near.short_name + " 기준" : ""}</div>
        ${weatherMini(w, near?.alert)}
        ${near ? `<div class="text-[12px] text-cyan-100 mb-3">${st.badge || ""} · ${st.countdown || ""}</div>` : ""}
        ${near ? tideTimeline(near) : ""}
        <div class="text-[11px] font-semibold text-slate-400 mb-1.5">등록된 내 포인트</div>
        <div class="space-y-1.5">
          ${list.map((item) => `
            <div class="flex items-center gap-2 rounded-xl border ${item.id === mine.id ? "border-amber-300/40 bg-amber-400/10" : "border-white/10 bg-white/5"} px-3 py-2">
              <button data-pick="${item.id}" class="flex-1 text-left min-w-0">
                <div class="text-[13px] font-bold truncate">⭐ ${escapeHtml(item.name)}</div>
                <div class="text-[11px] text-slate-400 truncate">${escapeHtml(item.species || "어종 미입력")} · ${escapeHtml(item.memo || "메모 없음")}</div>
              </button>
              <button data-del="${item.id}" class="text-[11px] text-rose-300 shrink-0">삭제</button>
            </div>`).join("")}
        </div>
      `;
      $("card").querySelectorAll("[data-pick]").forEach((b) => b.addEventListener("click", () => selectMine(b.dataset.pick, true)));
      $("card").querySelectorAll("[data-del]").forEach((b) => b.addEventListener("click", () => deleteMine(b.dataset.del)));
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    function metric(label, value, sub) {
      return `<div class="rounded-xl bg-white/5 border border-white/10 px-2 py-2 text-center">
        <div class="text-[10px] text-slate-400">${label}</div>
        <div class="text-[14px] font-bold tabular-nums">${value}</div>
        <div class="text-[10px] text-cyan-200/70 truncate">${sub}</div>
      </div>`;
    }

    function selectPoint(id, pan = false) {
      state.selected = id;
      state.selectedKind = "official";
      if (state.tab !== "official") setTab("official");
      else { renderChips(); renderCard(); }
      highlightMarkers();
      if (state.sheet < HALF) setSheet(HALF);
      const p = state.data.points.find((x) => x.id === id);
      if (pan && p && state.map && window.kakao) {
        state.map.panTo(new kakao.maps.LatLng(p.lat, p.lng));
      }
    }

    function selectMine(id, pan = false) {
      state.selected = id;
      state.selectedKind = "mine";
      if (state.tab !== "mine") setTab("mine");
      else { renderChips(); renderCard(); }
      highlightMarkers();
      if (state.sheet < HALF) setSheet(HALF);
      const p = state.mine.find((x) => x.id === id);
      if (pan && p && state.map && window.kakao) {
        state.map.panTo(new kakao.maps.LatLng(p.lat, p.lng));
        state.map.setLevel(5);
      }
    }

    function highlightMarkers() {
      Object.entries(state.overlays).forEach(([id, ov]) => {
        const el = ov.getContent();
        if (typeof el === "string") return;
        const pin = el.querySelector(".pin");
        if (!pin) return;
        pin.classList.toggle("pin-on", state.selectedKind === "official" && id === state.selected);
      });
      Object.entries(state.mineOverlays).forEach(([id, ov]) => {
        const el = ov.getContent();
        if (typeof el === "string") return;
        const pin = el.querySelector(".pin-mine");
        if (!pin) return;
        pin.classList.toggle("pin-on", state.selectedKind === "mine" && id === state.selected);
      });
    }

    function paintOfficialPin(wrap, p) {
      const level = alertLevel(p);
      const color = ALERT_COLOR[level];
      const pin = wrap.querySelector(".pin");
      const label = wrap.querySelector(".pin-label");
      if (pin) {
        pin.className = "pin pin-" + level;
        pin.style.background = color;
      }
      if (label) {
        label.className = "pin-label pin-label-" + level;
        label.textContent = p.short_name;
      }
    }

    function drawOfficialMarkers() {
      if (!state.map || !window.kakao) return;
      const keep = new Set();
      (state.data?.points || []).forEach((p) => {
        keep.add(p.id);
        const existing = state.overlays[p.id];
        if (existing) {
          const el = existing.getContent();
          if (el && el.nodeType === 1) paintOfficialPin(el, p);
          return;
        }
        const level = alertLevel(p);
        const color = ALERT_COLOR[level];
        const wrap = document.createElement("div");
        wrap.className = "pin-wrap";
        wrap.innerHTML = `<div class="pin pin-${level}" style="background:${color}"></div><div class="pin-label pin-label-${level}">${p.short_name}</div>`;
        wrap.addEventListener("click", (e) => { e.stopPropagation(); selectPoint(p.id, false); });
        const overlay = new kakao.maps.CustomOverlay({
          position: new kakao.maps.LatLng(p.lat, p.lng),
          content: wrap,
          yAnchor: 0.5,
          xAnchor: 0.5,
          clickable: true,
          zIndex: level === "danger" ? 5 : level === "caution" ? 3 : 2,
        });
        overlay.setMap(null);
        state.overlays[p.id] = overlay;
        state.overlayOn[p.id] = false;
      });
      Object.keys(state.overlays).forEach((id) => {
        if (keep.has(id)) return;
        state.overlays[id].setMap(null);
        delete state.overlays[id];
        delete state.overlayOn[id];
      });
      applyMapFilters();
    }

    function drawMineMarkers() {
      if (!state.map || !window.kakao) return;
      const keep = new Set((state.mine || []).map((p) => p.id));
      Object.keys(state.mineOverlays).forEach((id) => {
        if (keep.has(id)) return;
        state.mineOverlays[id].setMap(null);
        delete state.mineOverlays[id];
        delete state.overlayOn[id];
      });
      (state.mine || []).forEach((p) => {
        if (state.mineOverlays[p.id]) return;
        const wrap = document.createElement("div");
        wrap.className = "pin-wrap";
        wrap.innerHTML = `<div class="pin-mine">⭐</div><div class="pin-label pin-label-mine">${p.name}</div>`;
        wrap.addEventListener("click", (e) => { e.stopPropagation(); selectMine(p.id, false); });
        const overlay = new kakao.maps.CustomOverlay({
          position: new kakao.maps.LatLng(p.lat, p.lng),
          content: wrap,
          yAnchor: 0.5,
          xAnchor: 0.5,
          clickable: true,
          zIndex: 6,
        });
        overlay.setMap(null);
        state.mineOverlays[p.id] = overlay;
        state.overlayOn[p.id] = false;
      });
      applyMapFilters();
    }

    function drawGpsPin() {
      if (!state.map || !window.kakao || !state.myPos) return;
      if (state.gpsOverlay) state.gpsOverlay.setMap(null);
      const wrap = document.createElement("div");
      wrap.className = "pin-wrap";
      wrap.innerHTML = `<div class="pulse-pin"></div><div class="pin-label pin-label-gps">내 위치</div>`;
      state.gpsOverlay = new kakao.maps.CustomOverlay({
        position: new kakao.maps.LatLng(state.myPos.lat, state.myPos.lng),
        content: wrap,
        yAnchor: 0.5,
        xAnchor: 0.5,
        zIndex: 8,
      });
      state.gpsOverlay.setMap(state.map);
    }

    function drawMarkers() {
      drawOfficialMarkers();
      drawMineMarkers();
      drawGpsPin();
      applyMapFilters();
      highlightMarkers();
    }

    function renderFallbackList() {
      const list = visibleOfficials();
      $("fallback-list").innerHTML = (list.length ? list : (state.data?.points || [])).map((p) => `
        <button data-id="${p.id}" class="w-full text-left rounded-2xl border border-white/10 bg-white/5 p-3">
          <div class="flex justify-between items-center">
            <span class="font-bold">${p.name}</span>
            <span class="text-[11px] font-bold px-2 py-0.5 rounded-full ${badgeClass(p.alert.level)}">${p.alert.label}</span>
          </div>
          <div class="text-[12px] text-slate-400 mt-1">${p.weather.water_temp ?? "-"}℃ · ${p.weather.wind_dir} ${p.weather.wind_speed}m/s · 파고 ${p.weather.wave_height}m</div>
          <div class="mt-1.5 flex flex-wrap gap-1">${p.today_species.map((s) => `<span class="tag text-[11px] px-2 py-0.5 rounded-full">#${s}</span>`).join("")}</div>
        </button>
      `).join("");
      $("fallback-list").querySelectorAll("button").forEach((b) => b.addEventListener("click", () => {
        selectPoint(b.dataset.id);
        setSheet(FULL);
      }));
    }

    function showMapFallback(message) {
      $("fallback-msg").textContent = message;
      $("map-fallback").style.display = "block";
      renderFallbackList();
    }

    function loadKakaoSdk(kakaoKey) {
      return new Promise((resolve, reject) => {
        const s = document.createElement("script");
        s.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${encodeURIComponent(kakaoKey)}&autoload=false&libraries=services`;
        const timer = setTimeout(() => reject(new Error("timeout")), 8000);
        s.onload = () => {
          clearTimeout(timer);
          if (!window.kakao || !kakao.maps) reject(new Error("sdk"));
          else resolve();
        };
        s.onerror = () => { clearTimeout(timer); reject(new Error("script")); };
        document.head.appendChild(s);
      });
    }

    async function initMap(kakaoKey) {
      if (!kakaoKey) {
        showMapFallback("카카오 지도 키가 없어 목록으로 보여 줍니다.");
        return;
      }
      try {
        await loadKakaoSdk(kakaoKey);
        await new Promise((resolve, reject) => {
          try { kakao.maps.load(() => resolve()); }
          catch (e) { reject(e); }
        });
        state.kakaoReady = true;
        const center = new kakao.maps.LatLng(36.05, 129.45);
        state.map = new kakao.maps.Map($("map"), { center, level: 10 });
        if (kakao.maps.services) {
          state.places = new kakao.maps.services.Places();
          state.geocoder = new kakao.maps.services.Geocoder();
        }
        drawMarkers();
        const bounds = new kakao.maps.LatLngBounds();
        state.data.points.forEach((p) => bounds.extend(new kakao.maps.LatLng(p.lat, p.lng)));
        try { state.map.setBounds(bounds); } catch (_) {}
      } catch (_) {
        showMapFallback("카카오 지도를 열지 못했습니다. 카카오 개발자 콘솔 → JavaScript SDK 도메인에 " + API_BASE + " 을 등록한 뒤 새로고침하세요.");
      }
    }

    function looksLikeAddress(q) {
      return /\d/.test(q) && /(시|군|구|읍|면|동|리|로|길|가|번지|-)/.test(q);
    }

    function normKey(hit) {
      return (Number(hit.lat).toFixed(5) + "," + Number(hit.lng).toFixed(5) + "|" + (hit.name || ""));
    }

    function dedupeHits(list) {
      const seen = new Set();
      const out = [];
      list.forEach((hit) => {
        if (!Number.isFinite(hit.lat) || !Number.isFinite(hit.lng)) return;
        const k = normKey(hit);
        if (seen.has(k)) return;
        seen.add(k);
        out.push(hit);
      });
      return out;
    }

    function localHits(q) {
      const n = q.replace(/\s/g, "").toLowerCase();
      const fromOfficial = (state.data?.points || []).filter((p) =>
        (p.name + p.short_name + p.area).replace(/\s/g, "").toLowerCase().includes(n)
      ).map((p) => ({
        kind: "point", name: p.name, sub: p.area + " · 추천 포인트", lat: p.lat, lng: p.lng, pointId: p.id,
      }));
      const fromMine = (state.mine || []).filter((p) =>
        (p.name + (p.species || "")).replace(/\s/g, "").toLowerCase().includes(n)
      ).map((p) => ({
        kind: "mine", name: p.name, sub: "내 포인트", lat: p.lat, lng: p.lng, pointId: p.id,
      }));
      return [...fromOfficial, ...fromMine];
    }

    function keywordSearchOnce(query) {
      return new Promise((resolve) => {
        if (!state.places) return resolve([]);
        const loc = new kakao.maps.LatLng(POHANG.lat, POHANG.lng);
        state.places.keywordSearch(query, (data, status) => {
          if (status !== kakao.maps.services.Status.OK || !data) return resolve([]);
          resolve(data.map((d) => ({
            kind: "place",
            name: d.place_name,
            sub: d.road_address_name || d.address_name || "장소",
            lat: Number(d.y),
            lng: Number(d.x),
          })));
        }, { location: loc, radius: 40000, size: 10 });
      });
    }

    function geocodeOnce(query) {
      return new Promise((resolve) => {
        if (!state.geocoder) return resolve([]);
        state.geocoder.addressSearch(query, (data, status) => {
          if (status !== kakao.maps.services.Status.OK || !data) return resolve([]);
          resolve(data.map((d) => {
            const road = d.road_address && d.road_address.address_name;
            const jibun = (d.address && d.address.address_name) || d.address_name;
            const isRoad = d.address_type === "ROAD" || d.address_type === "ROAD_ADDR" || !!road;
            return {
              kind: isRoad ? "road" : "jibun",
              name: road || jibun,
              sub: road && jibun && road !== jibun
                ? (isRoad ? "도로명 · 지번 " + jibun : "지번 · 도로명 " + road)
                : (isRoad ? "도로명 주소" : "지번 주소"),
              lat: Number(d.y),
              lng: Number(d.x),
            };
          }));
        });
      });
    }

    function hideSearchResults() {
      const el = $("search-results");
      if (el) el.classList.remove("open");
    }

    function kindLabel(kind) {
      return ({ place: "장소", road: "도로명", jibun: "지번", point: "추천", mine: "내포인트" }[kind] || "검색");
    }

    function renderSearchResults(hits) {
      const box = $("search-results");
      if (!hits.length) {
        box.innerHTML = `<div class="px-3 py-3 text-[12px] text-slate-400">검색 결과가 없습니다. 방파제 이름, 도로명, 지번을 입력해 보세요.</div>`;
        box.classList.add("open");
        return;
      }
      box.innerHTML = hits.slice(0, 12).map((h, i) => `
        <button type="button" class="search-hit" data-i="${i}">
          <div class="flex items-center gap-2">
            <span class="text-[10px] font-extrabold px-1.5 py-0.5 rounded-md bg-white/10 text-cyan-200">${kindLabel(h.kind)}</span>
            <span class="text-[13px] font-bold truncate">${escapeHtml(h.name)}</span>
          </div>
          <div class="text-[11px] text-slate-400 mt-0.5 truncate">${escapeHtml(h.sub || "")}</div>
        </button>
      `).join("");
      box.classList.add("open");
      box.querySelectorAll(".search-hit").forEach((btn) => {
        btn.addEventListener("click", () => selectSearchHit(hits[Number(btn.dataset.i)]));
      });
    }

    async function unifiedSearch(raw) {
      const q = String(raw || "").trim();
      if (q.length < 2) {
        hideSearchResults();
        return;
      }
      if (!state.places && !state.geocoder) {
        const local = localHits(q);
        renderSearchResults(local);
        if (!local.length) toast("카카오 검색 서비스를 아직 쓸 수 없습니다. 지도를 연 뒤 다시 시도하세요.");
        return;
      }
      const seq = ++state.searchSeq;
      const queries = [q];
      if (!/포항/.test(q)) queries.push("포항 " + q);
      const [placesA, placesB, geoA, geoB] = await Promise.all([
        keywordSearchOnce(queries[0]),
        queries[1] ? keywordSearchOnce(queries[1]) : Promise.resolve([]),
        geocodeOnce(queries[0]),
        queries[1] ? geocodeOnce(queries[1]) : Promise.resolve([]),
      ]);
      if (seq !== state.searchSeq) return;
      const addrFirst = looksLikeAddress(q);
      const merged = dedupeHits(addrFirst
        ? [...geoA, ...geoB, ...localHits(q), ...placesA, ...placesB]
        : [...localHits(q), ...placesA, ...placesB, ...geoA, ...geoB]);
      renderSearchResults(merged);
    }

    function drawSearchPin(hit) {
      if (!state.map || !window.kakao) return;
      if (state.searchOverlay) state.searchOverlay.setMap(null);
      const wrap = document.createElement("div");
      wrap.className = "pin-wrap";
      wrap.innerHTML = `<div class="pin-search"></div><div class="pin-label pin-label-search">${escapeHtml(hit.name)}</div>`;
      state.searchOverlay = new kakao.maps.CustomOverlay({
        position: new kakao.maps.LatLng(hit.lat, hit.lng),
        content: wrap,
        yAnchor: 0.5,
        xAnchor: 0.5,
        zIndex: 9,
      });
      state.searchOverlay.setMap(state.map);
    }

    function showSearchCard(hit) {
      $("search-card-title").textContent = hit.name;
      $("search-card-sub").textContent = hit.sub || `${hit.lat.toFixed(5)}, ${hit.lng.toFixed(5)}`;
      $("search-card").classList.add("open");
      state.saveTarget = { lat: hit.lat, lng: hit.lng, name: hit.name, sub: hit.sub };
    }

    function selectSearchHit(hit) {
      hideSearchResults();
      if (hit.kind === "point") {
        selectPoint(hit.pointId, true);
      } else if (hit.kind === "mine") {
        selectMine(hit.pointId, true);
      }
      if (state.map && window.kakao) {
        const latlng = new kakao.maps.LatLng(hit.lat, hit.lng);
        state.map.setLevel(4);
        state.map.panTo(latlng);
        drawSearchPin(hit);
      }
      showSearchCard(hit);
      if (state.sheet > HALF) setSheet(PEEK);
    }

    function recommendedSpecies(lat, lng) {
      const month = state.data?.month || (new Date().getMonth() + 1);
      const near = (lat != null && lng != null) ? nearestOfficial(lat, lng) : (state.data?.points || [])[0];
      const extras = SEASON_TAGS[month] || SEASON_TAGS[9];
      const city = [];
      (state.data?.points || []).forEach((p) => (p.today_species || []).forEach((s) => city.push(s)));
      const seen = new Set();
      const out = [];
      [...(near?.today_species || []), ...extras, ...city].forEach((s) => {
        if (!s || seen.has(s)) return;
        seen.add(s);
        out.push(s);
      });
      return out.slice(0, 8);
    }

    function renderSpeciesPicks(lat, lng) {
      const wrap = $("species-picks");
      if (!wrap) return;
      const tags = recommendedSpecies(lat, lng);
      wrap.innerHTML = tags.map((s) => `<button type="button" class="sp-tag" data-sp="${escapeHtml(s)}">#${escapeHtml(s)}</button>`).join("");
      wrap.querySelectorAll("button").forEach((btn) => {
        const name = btn.dataset.sp;
        btn.classList.toggle("is-on", state.pickedSpecies.has(name));
        btn.addEventListener("click", () => {
          if (state.pickedSpecies.has(name)) state.pickedSpecies.delete(name);
          else state.pickedSpecies.add(name);
          btn.classList.toggle("is-on", state.pickedSpecies.has(name));
          $("f-species").value = [...state.pickedSpecies].join(", ");
        });
      });
    }

    function mapCenterPos() {
      if (!state.map || !window.kakao) return null;
      const c = state.map.getCenter();
      return { lat: c.getLat(), lng: c.getLng() };
    }

    function locateMe() {
      if (!navigator.geolocation) {
        toast("이 브라우저는 위치 정보를 지원하지 않습니다.");
        return;
      }
      const apply = (pos, announce) => {
        state.myPos = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        if (state.map && window.kakao) {
          const latlng = new kakao.maps.LatLng(state.myPos.lat, state.myPos.lng);
          state.map.setLevel(5);
          state.map.panTo(latlng);
          drawGpsPin();
        }
        if (announce) toast("현 위치를 표시했습니다.");
      };
      toast("현재 위치를 찾는 중…");
      navigator.geolocation.getCurrentPosition(
        (pos) => apply(pos, true),
        (err) => {
          const msg = err.code === 1 ? "위치 권한이 거부되었습니다." : "위치를 가져오지 못했습니다.";
          toast(msg);
        },
        { enableHighAccuracy: true, timeout: 12000, maximumAge: 20000 }
      );
      if (state.gpsWatchId == null) {
        state.gpsWatchId = navigator.geolocation.watchPosition(
          (pos) => apply(pos, false),
          () => {},
          { enableHighAccuracy: true, maximumAge: 8000, timeout: 20000 }
        );
      }
    }

    function openSaveModal(preset) {
      const pos = preset || state.saveTarget || state.myPos || mapCenterPos();
      if (!pos || pos.lat == null || pos.lng == null) {
        toast("저장할 위치를 잡지 못했습니다. GPS 또는 검색을 먼저 해 주세요.");
        locateMe();
        return;
      }
      state.saveTarget = { lat: pos.lat, lng: pos.lng, name: pos.name || "", sub: pos.sub || "" };
      $("save-coords").textContent = `${state.saveTarget.sub ? state.saveTarget.sub + " · " : ""}${state.saveTarget.lat.toFixed(6)}, ${state.saveTarget.lng.toFixed(6)}`;
      $("f-name").value = state.saveTarget.name || "";
      $("f-species").value = "";
      $("f-depth").value = "";
      $("f-memo").value = "";
      $("f-snag").checked = false;
      state.pickedSpecies = new Set();
      renderSpeciesPicks(state.saveTarget.lat, state.saveTarget.lng);
      $("save-modal").classList.add("open");
      setTimeout(() => $("f-name").focus(), 50);
    }

    function closeSaveModal() {
      $("save-modal").classList.remove("open");
    }

    function saveMinePoint(e) {
      e.preventDefault();
      const pos = state.saveTarget || state.myPos || mapCenterPos();
      if (!pos) return;
      const typed = $("f-species").value.trim();
      const fromTags = [...state.pickedSpecies];
      const species = typed || fromTags.join(", ");
      const item = {
        id: "mine-" + Date.now(),
        name: $("f-name").value.trim() || pos.name || "내 포인트",
        species,
        depth: $("f-depth").value.trim(),
        memo: $("f-memo").value.trim(),
        snag: $("f-snag").checked,
        lat: pos.lat,
        lng: pos.lng,
        address: pos.sub || "",
        createdAt: new Date().toISOString(),
      };
      if (!item.name) { toast("포인트 이름을 입력하세요."); return; }
      state.mine = [item, ...state.mine];
      persistMine();
      closeSaveModal();
      $("search-card").classList.remove("open");
      hideSearchResults();
      drawMineMarkers();
      selectMine(item.id, true);
      toast("내 포인트가 이 기기에 저장되었습니다.");
    }

    function deleteMine(id) {
      if (!confirm("이 포인트를 삭제할까요?")) return;
      state.mine = state.mine.filter((p) => p.id !== id);
      persistMine();
      if (state.selected === id) state.selected = state.mine[0]?.id || null;
      drawMineMarkers();
      renderChips();
      renderCard();
      toast("포인트를 삭제했습니다.");
    }

    async function loadData(refresh = false) {
      const path = refresh ? "/api/recommend?refresh=true" : "/api/recommend";
      state.data = await apiGet(path);
      $("subhead").textContent = `${fmtDate(state.data.date)} · ${state.data.summary.headline}`;
      if (!state.selected) {
        state.selected = state.data.points[0]?.id;
        state.selectedKind = "official";
        state.tab = "official";
      }
      renderChips();
      renderCard();
      if (state.kakaoReady) drawMarkers();
      if ($("map-fallback").style.display === "block") renderFallbackList();
    }

    function bindSheetDrag() {
      const handle = $("sheet-handle");
      let startY = 0, startH = 0, dragging = false, lastY = 0, lastT = 0, vel = 0, raf = 0;
      const onStart = (y) => {
        dragging = true;
        startY = lastY = y;
        startH = state.sheet;
        lastT = performance.now();
        vel = 0;
        $("sheet").classList.add("dragging");
      };
      const onMove = (y) => {
        if (!dragging) return;
        const now = performance.now();
        const dt = Math.max(1, now - lastT);
        vel = (y - lastY) / dt;
        lastY = y;
        lastT = now;
        const next = Math.max(PEEK, Math.min(FULL, startH + (startY - y)));
        if (raf) cancelAnimationFrame(raf);
        raf = requestAnimationFrame(() => setSheet(next, false));
      };
      const onEnd = () => {
        if (!dragging) return;
        dragging = false;
        if (raf) { cancelAnimationFrame(raf); raf = 0; }
        let snap;
        if (vel > 0.85) snap = PEEK;
        else if (vel < -0.85) snap = FULL;
        else snap = [PEEK, HALF, FULL].reduce((a, b) => Math.abs(b - state.sheet) < Math.abs(a - state.sheet) ? b : a);
        setSheet(snap, true);
      };
      handle.addEventListener("touchstart", (e) => onStart(e.touches[0].clientY), { passive: true });
      handle.addEventListener("touchmove", (e) => onMove(e.touches[0].clientY), { passive: true });
      handle.addEventListener("touchend", onEnd);
      handle.addEventListener("touchcancel", onEnd);
      handle.addEventListener("mousedown", (e) => onStart(e.clientY));
      window.addEventListener("mousemove", (e) => onMove(e.clientY));
      window.addEventListener("mouseup", onEnd);
    }

    $("btn-refresh").addEventListener("click", async () => {
      $("subhead").textContent = "다시 계산하는 중…";
      try { await loadData(true); } catch { $("subhead").textContent = "갱신 실패 · 네트워크를 확인하세요"; }
    });
    $("tab-official").addEventListener("click", () => {
      state.selectedKind = "official";
      if (!visibleOfficials().some((p) => p.id === state.selected)) {
        state.selected = visibleOfficials()[0]?.id || state.data?.points?.[0]?.id;
      }
      setTab("official");
      highlightMarkers();
    });
    $("tab-mine").addEventListener("click", () => {
      if (state.mine[0]) {
        state.selected = state.mine[0].id;
        state.selectedKind = "mine";
      }
      setTab("mine");
      highlightMarkers();
    });
    $("btn-gps").addEventListener("click", locateMe);
    $("btn-add").addEventListener("click", () => {
      const fromSearch = $("search-card").classList.contains("open") ? state.saveTarget : null;
      openSaveModal(fromSearch || state.myPos || mapCenterPos());
    });
    $("btn-save-search").addEventListener("click", () => openSaveModal(state.saveTarget));
    $("search-form").addEventListener("submit", (e) => {
      e.preventDefault();
      unifiedSearch($("place-search").value);
    });
    let searchTimer = 0;
    $("place-search").addEventListener("input", () => {
      clearTimeout(searchTimer);
      const q = $("place-search").value;
      searchTimer = setTimeout(() => unifiedSearch(q), 280);
    });
    $("place-search").addEventListener("focus", () => {
      if ($("search-results").innerHTML) $("search-results").classList.add("open");
    });
    document.addEventListener("click", (e) => {
      if (!e.target.closest(".search-wrap")) hideSearchResults();
    });
    $("save-backdrop").addEventListener("click", closeSaveModal);
    $("save-close").addEventListener("click", closeSaveModal);
    $("save-form").addEventListener("submit", saveMinePoint);
    document.querySelectorAll(".legend-btn").forEach((btn) => {
      btn.addEventListener("click", () => toggleFilter(btn.dataset.filter));
    });

    (async function boot() {
      state.mine = loadMine();
      state.tab = "official";
      state.selectedKind = "official";
      refreshSheetStops();
      setSheet(PEEK, false);
      bindSheetDrag();
      window.addEventListener("resize", () => {
        const stage = state.sheet > (HALF + FULL) / 2 ? 2 : state.sheet > (PEEK + HALF) / 2 ? 1 : 0;
        refreshSheetStops();
        setSheet([PEEK, HALF, FULL][stage], false);
      });
      try {
        let cfg = window.__YUNFISH_CONFIG__;
        if (!cfg) {
          cfg = await apiGet("/api/config");
        }
        await loadData(false);
        setSheet(PEEK, true);
        setTab("official");
        await initMap(cfg.kakao_js_key);
      } catch (err) {
        $("subhead").textContent = "서버에 연결하지 못했습니다";
        $("card").innerHTML = `<p class="text-sm text-rose-300">API를 불러오지 못했습니다. 같은 주소의 /api/health 가 열리는지 확인한 뒤 새로고침해 주세요.</p>`;
      }
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/service-worker.js").catch(() => {});
      }
    })();
  </script>
</body>
</html>
